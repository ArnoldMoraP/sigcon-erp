# =====================================================================
#  Caso Siderurgica Peru - microservicios
#  6 servicios + MySQL para ms-rrhh
#
#  Requisitos previos:
#    1) Copiar .env.example como .env y rellenar credenciales
#    2) Levantar:  docker compose up --build
#
#  FASE 5: los Dockerfile ahora son multi-stage (compilan el JAR dentro de
#  Docker), asi que YA NO hace falta correr build-jars.ps1 antes. Un solo
#  'docker compose up --build' levanta todo desde cero.
#
#  FASE 2 (seguridad): solo api-gateway (8080) y eureka-server (8761, debug)
#  quedan publicados al host. ms-auth/ventas/inventario/rrhh y mysql NO exponen
#  puertos al host: solo son alcanzables dentro de la red interna de Docker.
#  Toda peticion externa entra por el gateway, que valida el JWT.
#
#  IMPORTANTE: dentro de Docker NO existe "localhost". Cada contenedor se
#  llama por el nombre del servicio (eureka-server, mysql-rrhh, etc.).
# =====================================================================

services:

  # ------------------------------------------------ Config Server (config centralizada)
  #  Sirve la configuracion de config-repo/ a todos los microservicios.
  #  Arranca primero: los demas le piden su config al iniciar.
  config-server:
    build: ./config-server
    container_name: config-server
    expose:
      - "8888"
    environment:
      CONFIG_LOCATIONS: file:/config-repo
    volumes:
      # carpeta local con toda la configuracion centralizada (modo native)
      - ./config-repo:/config-repo:ro
    networks:
      - siderurgica-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------ Service Discovery
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"          # publicado solo para poder ver el panel de Eureka (debug)
    networks:
      - siderurgica-net
    healthcheck:
      # FASE 0: ahora eureka-server incluye spring-boot-starter-actuator y
      # expone /actuator/health, asi que este healthcheck por fin pasa.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ------------------------------------------------ MySQL para ms-rrhh
  mysql-rrhh:
    image: mysql:8.0
    container_name: mysql-rrhh
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # FASE 2: sin 'ports:'. La base solo se usa desde ms-rrhh por la red interna.
    # Para inspeccionarla desde el host durante debug, descomentar:
    # ports:
    #   - "3307:3306"
    expose:
      - "3306"
    volumes:
      # el init.sql solo se ejecuta la PRIMERA vez que se crea el volumen
      - ./ms-rrhh/db/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mysql_rrhh_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - siderurgica-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------ ms-auth (PostgreSQL / Neon)
  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    # FASE 2: sin 'ports:'. Solo alcanzable por la red interna (via el gateway).
    expose:
      - "8081"
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}/${DB_NAME_AUTH}?sslmode=require
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - siderurgica-net
    healthcheck:
      # FASE 0/2: /actuator/health esta permitido sin token en el SecurityConfig de ms-auth.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ------------------------------------------------ ms-ventas (PostgreSQL / Neon)
  ms-ventas:
    build: ./ms-ventas
    container_name: ms-ventas
    expose:
      - "8082"
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}/${DB_NAME_VENTAS}?sslmode=require
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - siderurgica-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ------------------------------------------------ ms-inventario (PostgreSQL / Neon)
  ms-inventario:
    build: ./ms-inventario
    container_name: ms-inventario
    expose:
      - "8083"
    environment:
      # OJO: SIN currentSchema. Este MS usa dos schemas (compras y almacen),
      # declarados en cada entidad con @Table(schema="...")
      DB_URL: jdbc:postgresql://${DB_HOST}/${DB_NAME_INVENTARIO}?sslmode=require
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - siderurgica-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ------------------------------------------------ ms-rrhh (MySQL)
  ms-rrhh:
    build: ./ms-rrhh
    container_name: ms-rrhh
    expose:
      - "8084"
    environment:
      # 'mysql-rrhh' es el nombre del contenedor, no localhost
      DB_URL: jdbc:mysql://mysql-rrhh:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql-rrhh:
        condition: service_healthy
    networks:
      - siderurgica-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ------------------------------------------------ api-gateway (puerta unica)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"          # UNICO punto de entrada publico del sistema
    environment:
      # el JWT_SECRET DEBE ser el mismo que el de ms-auth
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      ms-auth:
        condition: service_healthy   # FASE 0: ahora ms-auth tiene healthcheck
    networks:
      - siderurgica-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  siderurgica-net:
    driver: bridge

volumes:
  mysql_rrhh_data:
