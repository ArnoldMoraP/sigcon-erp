# =====================================================================
#  api-gateway: UNICO servicio expuesto al exterior.
#
#  type: LoadBalancer
#    - en Docker Desktop  -> queda accesible en localhost:8080
#    - en Oracle OKE      -> Oracle provisiona un Load Balancer con IP publica
#  El YAML es el mismo en ambos casos.
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: siderurgica
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: siderurgica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: esperar-eureka
          image: busybox:1.36
          command: ['sh','-c','until nc -z eureka-server 8761; do echo "esperando a eureka..."; sleep 5; done; echo "eureka listo"']
      containers:
        - name: api-gateway
          image: siderurgica/api-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef: { name: siderurgica-config, key: EUREKA_URL }
            # el MISMO secreto que firma los tokens en ms-auth
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: JWT_SECRET }
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
