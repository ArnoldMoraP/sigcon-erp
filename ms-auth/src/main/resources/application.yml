# Config LOCAL minima: lo unico que necesita el servicio para arrancar y
# pedirle el RESTO de su configuracion al config-server. Todo lo demas
# (datasource, jpa, eureka, jwt, rutas, etc.) vive en la carpeta central
# config-repo/ y lo sirve el config-server.
spring:
  application:
    name: ms-auth
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      # Si el config-server aun no responde, reintentar en vez de morir.
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.3
