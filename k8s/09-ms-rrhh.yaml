apiVersion: v1
kind: Service
metadata:
  name: ms-rrhh
  namespace: siderurgica
spec:
  type: ClusterIP          # no se expone fuera: todo entra por el gateway
  selector:
    app: ms-rrhh
  ports:
    - port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-rrhh
  namespace: siderurgica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-rrhh
  template:
    metadata:
      labels:
        app: ms-rrhh
    spec:
      # initContainer: no arranca hasta que Eureka, config-server y MySQL respondan.
      # Es el equivalente K8s del "depends_on: condition: service_healthy" del compose.
      initContainers:
        - name: esperar-config-server
          image: busybox:1.36
          command: ['sh','-c','until nc -z config-server 8888; do echo "esperando a config-server..."; sleep 5; done; echo "config-server listo"']
        - name: esperar-eureka
          image: busybox:1.36
          command: ['sh','-c','until nc -z eureka-server 8761; do echo "esperando a eureka..."; sleep 5; done; echo "eureka listo"']
        - name: esperar-mysql
          image: busybox:1.36
          command: ['sh','-c','until nc -z mysql-rrhh 3306; do echo "esperando a mysql-rrhh..."; sleep 5; done; echo "mysql listo"']
      containers:
        - name: ms-rrhh
          image: siderurgica/ms-rrhh:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef: { name: siderurgica-config, key: EUREKA_URL }
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef: { name: siderurgica-config, key: CONFIG_SERVER_URL }
            # --- MySQL dentro del cluster ---
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: MYSQL_DATABASE }
            - name: DB_URL
              value: "jdbc:mysql://mysql-rrhh:3306/$(MYSQL_DATABASE)?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: MYSQL_PASSWORD }

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"