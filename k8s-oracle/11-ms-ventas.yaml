apiVersion: v1
kind: Service
metadata:
  name: ms-ventas
  namespace: siderurgica
spec:
  type: ClusterIP          # no se expone fuera: todo entra por el gateway
  selector:
    app: ms-ventas
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-ventas
  namespace: siderurgica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-ventas
  template:
    metadata:
      labels:
        app: ms-ventas
    spec:
      # initContainer: no arranca hasta que Eureka y config-server respondan.
      # Es el equivalente K8s del "depends_on: condition: service_healthy" del compose.
      initContainers:
        - name: esperar-config-server
          image: docker.io/library/busybox:1.36
          command: ['sh','-c','until nc -z config-server 8888; do echo "esperando a config-server..."; sleep 5; done; echo "config-server listo"']
        - name: esperar-eureka
          image: docker.io/library/busybox:1.36
          command: ['sh','-c','until nc -z eureka-server 8761; do echo "esperando a eureka..."; sleep 5; done; echo "eureka listo"']

      containers:
        - name: ms-ventas
          image: iad.ocir.io/idxarx3sn3vb/siderurgica/ms-ventas:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef: { name: siderurgica-config, key: EUREKA_URL }
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef: { name: siderurgica-config, key: CONFIG_SERVER_URL }
            # --- Neon (PostgreSQL) ---
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_HOST }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_NAME_VENTAS }
            - name: DB_URL
              value: "jdbc:postgresql://$(DB_HOST)/$(DB_NAME)?sslmode=require"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_PASSWORD }

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"