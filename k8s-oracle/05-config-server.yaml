# =====================================================================
#  Config Server: sirve config-repo/ a todos los microservicios.
#  El contenido de config-repo/ se monta via ConfigMap (config-repo-files),
#  igual que mysql-init-script monta el .sql.
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: siderurgica
spec:
  type: ClusterIP
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: siderurgica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: iad.ocir.io/idxarx3sn3vb/siderurgica/config-server:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
          env:
            - name: CONFIG_LOCATIONS
              value: "file:/config-repo"
          volumeMounts:
            - name: config-repo
              mountPath: /config-repo
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: config-repo
          configMap:
            name: config-repo-files