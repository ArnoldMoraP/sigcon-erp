apiVersion: v1
kind: Service
metadata:
  name: ms-inventario
  namespace: siderurgica
spec:
  type: ClusterIP          # no se expone fuera: todo entra por el gateway
  selector:
    app: ms-inventario
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-inventario
  namespace: siderurgica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-inventario
  template:
    metadata:
      labels:
        app: ms-inventario
    spec:
      # initContainer: no arranca hasta que Eureka y config-server respondan.
      # Es el equivalente K8s del "depends_on: condition: service_healthy" del compose.
      initContainers:
        - name: esperar-config-server
          image: busybox:1.36
          command: ['sh','-c','until nc -z config-server 8888; do echo "esperando a config-server..."; sleep 5; done; echo "config-server listo"']
        - name: esperar-eureka
          image: busybox:1.36
          command: ['sh','-c','until nc -z eureka-server 8761; do echo "esperando a eureka..."; sleep 5; done; echo "eureka listo"']

      containers:
        - name: ms-inventario
          image: siderurgica/ms-inventario:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef: { name: siderurgica-config, key: EUREKA_URL }
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef: { name: siderurgica-config, key: CONFIG_SERVER_URL }
            # --- Neon (PostgreSQL) ---
            # OJO: SIN currentSchema. Este MS usa dos schemas (compras y almacen),
            # declarados en cada entidad con @Table(schema="...")
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_HOST }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_NAME_INVENTARIO }
            - name: DB_URL
              value: "jdbc:postgresql://$(DB_HOST)/$(DB_NAME)?sslmode=require"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: siderurgica-secrets, key: DB_PASSWORD }

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"