# Configuracion COMPARTIDA por todos los microservicios (config clients).
# El Config Server la sirve junto con el archivo especifico de cada servicio.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
