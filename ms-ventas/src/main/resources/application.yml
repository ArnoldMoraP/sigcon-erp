server:
  port: 8082

spring:
  application:
    name: ms-ventas
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Neon entrega la conexion con el search_path vacio. Sin esto
        # Hibernate emite 'FROM usuario' sin calificar y falla con
        # 'relation "usuario" does not exist'.
        default_schema: public
        format_sql: false
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true